name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  # Build first: a broken binary must block the release, not follow it.
  # Whether a version will be cut is only knowable by running the bump itself,
  # so the build runs on every master push and is cheap enough to keep that way.
  build-go:
    uses: djachenko/repokit/.github/workflows/go-release.yml@master

  release:
    needs: build-go
    uses: djachenko/repokit/.github/workflows/bash-release.yml@master
    secrets: inherit

  upload-go:
    needs: [build-go, release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: go-binaries
          path: bin/

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release.outputs.version }}" bin/merge_pyproject-*
