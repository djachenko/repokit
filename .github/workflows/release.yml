name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    uses: djachenko/repokit/.github/workflows/bash-release.yml@master
    secrets: inherit

  build-go:
    uses: djachenko/repokit/.github/workflows/go-release.yml@master

  upload-go:
    needs: [release, build-go]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: go-binaries
          path: bin/

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release.outputs.version }}" bin/merge_pyproject-*
