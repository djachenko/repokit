name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  # Build first: a broken binary must block the release, not follow it.
  # Whether a version will be cut is only knowable by running the bump itself,
  # so the build runs on every master push and is cheap enough to keep that way.
  build-go:
    uses: ./.github/workflows/go-release.yml

  release:
    needs: build-go
    uses: ./.github/workflows/bash-release.yml
    secrets: inherit

  upload-go:
    needs: [build-go, release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: go-binaries
          path: bin/

      # The release was created as a draft so that nothing points at it before
      # its binaries exist. --clobber lets a re-run replace assets a failed
      # attempt already uploaded. Publishing is the last step: if anything
      # before it fails, the release stays a draft and /releases/latest keeps
      # pointing at the previous, complete one.
      - name: Upload to release and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ needs.release.outputs.version }}" bin/repokore-* --clobber
          gh release edit "${{ needs.release.outputs.version }}" --draft=false
