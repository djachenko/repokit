name: Tests

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

# Local paths, not owner/repo/...@master. A local path resolves against the
# commit being tested, so a branch is checked by its own linters and tests —
# with @master it was checked by master's, one PR late, and a workflow that
# existed only on the branch could not be found at all, which made this whole
# file invalid and no job ran. Client wrappers keep @<version>: they call
# across repositories, where a local path cannot reach.
jobs:
  tests:
    uses: ./.github/workflows/bash-tests.yml
    secrets: inherit

  go-tests:
    uses: ./.github/workflows/go-tests.yml

  # Inline, not in bash-tests.yml: that one is also called by client repos,
  # which have neither tests/ nor repokore's sources.
  bats:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # The tests run the steps with the real repokore, the way the
      # orchestrator does; scripts/repokore-env looks for it in bin/.
      - uses: actions/setup-go@v5
        with:
          go-version-file: scripts/repokore/go.mod
          cache-dependency-path: scripts/repokore/go.sum

      - name: Build repokore
        working-directory: scripts/repokore
        run: go build -o ../../bin/repokore .

      - name: Install bats
        run: sudo apt-get install -y bats

      - name: bats
        run: bats tests/
