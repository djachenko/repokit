name: Tests

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install tools
        run: sudo apt-get install -y shellcheck shfmt

      # Found by shebang, not by name — see the script for why.
      - name: Collect shell scripts
        run: |
          scripts/shell-files > shell-files.txt
          echo "Linting:"
          cat shell-files.txt

      - name: shellcheck
        run: xargs -r shellcheck -x < shell-files.txt

      - name: shfmt
        run: xargs -r shfmt -i 2 -sr -d < shell-files.txt
